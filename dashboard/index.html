<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爱弥斯 · 控制台</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.20/index.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.css" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #0a0b0d;
    --surface: #101216;
    --surface-2: #14171c;
    --line: #20242b;
    --line-strong: #2b313a;
    --text: #e8eaee;
    --muted: #8b93a1;
    --faint: #5d6472;
    --accent: #5fd0a8;
    --accent-dim: #2c6b58;
    --accent-soft: rgba(95, 208, 168, 0.10);
    --danger: #e2686f;
    --warn: #d9a441;
    --radius: 10px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", "Geist Sans", "Satoshi", "Segoe UI Variable", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  button, input, textarea { font: inherit; color: inherit; }
  ::selection { background: var(--accent-soft); }

  /* 背景：极轻的网格 + 呼吸光斑，固定层、不参与滚动 */
  .backdrop {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .backdrop::before {
    content: ""; position: absolute; inset: -20%;
    background:
      radial-gradient(46rem 30rem at 18% -10%, rgba(95, 208, 168, 0.10), transparent 62%),
      radial-gradient(38rem 28rem at 88% 8%, rgba(120, 150, 190, 0.07), transparent 60%);
    animation: drift 26s var(--ease) infinite alternate;
  }
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.014) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.014) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(70% 60% at 50% 0%, #000 20%, transparent 100%);
  }
  @keyframes drift {
    from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
    to   { transform: translate3d(1.5%, 1.5%, 0) scale(1.04); }
  }

  /* ---------- 登录 ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    padding: 24px; background: rgba(8, 9, 11, 0.82); backdrop-filter: blur(14px);
  }
  .gate[hidden] { display: none; }
  .gate-card {
    width: min(420px, 100%); padding: 34px 32px 28px;
    background: linear-gradient(180deg, #14171c, #0f1115);
    border: 1px solid var(--line-strong); border-radius: 18px;
    box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    animation: rise 0.5s var(--ease) both;
  }
  .gate-card h1 { margin: 14px 0 6px; font-size: 20px; letter-spacing: -0.02em; font-weight: 600; }
  .gate-card p { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
  .gate-card .hint { margin-top: 14px; font-size: 12px; color: var(--faint); }
  .gate-card code { color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- 框架 ---------- */
  .shell {
    position: relative; z-index: 1; display: grid;
    grid-template-columns: 296px minmax(0, 1fr);
    min-height: 100dvh;
  }
  .rail {
    display: flex; flex-direction: column; gap: 14px;
    padding: 22px 18px 18px;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(16, 18, 22, 0.92), rgba(10, 11, 13, 0.72));
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: var(--accent-soft); border: 1px solid rgba(95, 208, 168, 0.28);
    color: var(--accent);
  }
  .brand-name { font-weight: 600; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--faint); letter-spacing: 0.02em; }

  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
    background: rgba(20, 23, 28, 0.7);
    transition: border-color 0.25s var(--ease), background 0.25s var(--ease);
  }
  .search:focus-within { border-color: var(--accent-dim); background: rgba(22, 26, 32, 0.9); }
  .search svg { color: var(--faint); flex: none; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 13px; }
  .search input::placeholder { color: var(--faint); }

  .nav { flex: 1; overflow: auto; margin: 0 -6px; padding: 2px 6px 8px; }
  .nav-group-label {
    margin: 14px 8px 6px; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--faint);
  }
  .item {
    position: relative; display: grid; gap: 2px;
    padding: 9px 12px 9px 14px; margin-bottom: 2px; border-radius: 8px;
    cursor: pointer; border: 1px solid transparent;
    transition: background 0.2s var(--ease), transform 0.2s var(--ease), border-color 0.2s var(--ease);
    animation: stagger 0.45s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 22ms);
  }
  .item:hover { background: rgba(255, 255, 255, 0.028); transform: translateX(2px); }
  .item:active { transform: translateX(2px) scale(0.995); }
  .item.active { background: var(--accent-soft); border-color: rgba(95, 208, 168, 0.22); }
  .item.active::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px;
    border-radius: 2px; background: var(--accent);
  }
  .item .title { font-size: 13.5px; font-weight: 400; letter-spacing: -0.005em; color: #e2e5ea; }
  .item .key { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .dot { position: absolute; right: 10px; top: 12px; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); opacity: 0; transition: opacity 0.2s var(--ease); }
  .item.active .dot { opacity: 1; }
  @keyframes stagger { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .rail-foot { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
  .rail-actions { display: none; }
  .status-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); position: relative; }
  .pulse::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 1px solid rgba(95, 208, 168, 0.5); animation: pulse 2.4s var(--ease) infinite;
  }
  @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.9; } 70%, 100% { transform: scale(1.5); opacity: 0; } }

  /* ---------- 主区 ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 11, 13, 0.78); backdrop-filter: blur(12px);
  }
  .topbar .crumb { font-size: 12px; color: var(--faint); letter-spacing: 0.04em; }
  .topbar .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line-strong); background: rgba(20, 23, 28, 0.8);
    color: var(--text); font-size: 13px; letter-spacing: -0.005em;
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease),
      transform 0.16s var(--ease), color 0.2s var(--ease);
  }
  .btn:hover { border-color: #38404b; background: rgba(28, 32, 38, 0.9); }
  .btn:active { transform: translateY(1px) scale(0.985); }
  .btn:focus-visible, .input:focus-visible, .search input:focus-visible { outline: none; }
  .btn svg { flex: none; opacity: 0.85; }
  .btn.primary {
    background: linear-gradient(180deg, rgba(95, 208, 168, 0.18), rgba(95, 208, 168, 0.10));
    border-color: rgba(95, 208, 168, 0.42); color: #d6fbec;
  }
  .btn.primary:hover { border-color: rgba(95, 208, 168, 0.62); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
  .btn.danger { border-color: rgba(226, 104, 111, 0.36); color: #f3b9bc;
    background: rgba(226, 104, 111, 0.08); }
  .btn.danger:hover { border-color: rgba(226, 104, 111, 0.6); }
  .btn.quiet-danger { color: #cf9ba0; border-color: var(--line-strong); background: transparent; }
  .btn.quiet-danger:hover { color: #f3b9bc; border-color: rgba(226, 104, 111, 0.45);
    background: rgba(226, 104, 111, 0.06); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }

  .scroll { flex: 1; overflow: auto; padding: 26px 28px 56px; }
  .doc-head { max-width: 66ch; margin-bottom: 22px; }
  .doc-head h2 {
    margin: 0 0 7px; font-size: clamp(20px, 2.1vw, 26px); font-weight: 600;
    letter-spacing: -0.028em; line-height: 1.15;
  }
  .doc-head p { margin: 0; color: var(--muted); font-size: 13px; max-width: 62ch; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px; font-size: 11.5px;
    border: 1px solid var(--line-strong); color: var(--muted);
    background: rgba(255, 255, 255, 0.02);
  }
  .tag.accent { color: var(--accent); border-color: rgba(95, 208, 168, 0.3); background: var(--accent-soft); }

  .fields {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-flow: row dense; column-gap: 28px; align-items: start;
  }
  .field { padding: 16px 0 18px; border-top: 1px solid var(--line); min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field.bool { padding: 13px 0 15px; }
  .field > label {
    display: flex; align-items: baseline; gap: 8px;
    font-weight: 400; font-size: 13.5px; letter-spacing: -0.005em; margin-bottom: 4px; color: #dfe3ea;
  }
  .field > label .k { font-size: 11px; color: var(--faint); font-weight: 400; }
  .field .hint { color: var(--faint); font-size: 12px; margin: 0 0 10px; max-width: 62ch; }

  .input, textarea.input {
    width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: rgba(11, 13, 16, 0.75);
    transition: border-color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }
  .input:hover { border-color: #343c47; }
  .input:focus { outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(95, 208, 168, 0.08); }
  textarea.input { min-height: 104px; resize: vertical; font-family: "JetBrains Mono", monospace; font-size: 12.5px; line-height: 1.7; }
  input[type="number"].input { max-width: 180px; }
  .input.invalid { border-color: rgba(226, 104, 111, 0.6); }
  .err { display: none; margin-top: 6px; font-size: 12px; color: var(--danger); }
  .err.show { display: block; }

  /* 开关 */
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track {
    width: 40px; height: 22px; border-radius: 999px; border: 1px solid var(--line-strong);
    background: rgba(255, 255, 255, 0.04); position: relative;
    transition: background 0.25s var(--ease), border-color 0.25s var(--ease);
  }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #9aa2b0;
    transition: transform 0.3s var(--ease), background 0.25s var(--ease);
  }
  .switch input:checked + .track { background: var(--accent-soft); border-color: rgba(95, 208, 168, 0.5); }
  .switch input:checked + .track::after { transform: translateX(18px); background: var(--accent); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px rgba(95, 208, 168, 0.14); }
  .switch .state { font-size: 12px; color: var(--muted); min-width: 2.2em; }

  /* 群号标签块 */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; min-height: 30px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 5px 3px 10px; border-radius: 999px; font-size: 12.5px;
    background: rgba(95, 208, 168, 0.07); border: 1px solid rgba(95, 208, 168, 0.22);
    animation: chipIn 0.28s var(--ease) both;
  }
  .chip .mono { letter-spacing: 0.01em; }
  .chip button {
    border: 0; background: transparent; cursor: pointer; color: var(--faint);
    padding: 0 4px; line-height: 1; border-radius: 6px;
    transition: color 0.2s var(--ease), transform 0.2s var(--ease);
  }
  .chip button:hover { color: var(--danger); transform: rotate(90deg); }
  @keyframes chipIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
  .chip-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip-row input { flex: 0 1 240px; }
  .count { font-size: 12px; color: var(--faint); }

  /* 底部动作条 */
  .actionbar {
    position: sticky; bottom: 0; z-index: 9;
    display: flex; align-items: center; gap: 10px;
    padding: 13px 28px;
    border-top: 1px solid var(--line);
    background: rgba(10, 11, 13, 0.9); backdrop-filter: blur(14px);
  }
  .actionbar .spacer { flex: 1; }
  .unsaved {
    display: none; align-items: center; gap: 7px; font-size: 12px; color: var(--warn);
  }
  .unsaved.show { display: inline-flex; }
  .unsaved i { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); display: block; }

  /* 抽屉 */
  .drawer-wrap { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  .drawer-wrap.open { pointer-events: auto; }
  .scrim {
    position: absolute; inset: 0; background: rgba(6, 7, 9, 0.6); opacity: 0;
    transition: opacity 0.3s var(--ease); backdrop-filter: blur(2px);
  }
  .drawer-wrap.open .scrim { opacity: 1; }
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(620px, 92vw);
    display: flex; flex-direction: column;
    background: #0d0f13; border-left: 1px solid var(--line-strong);
    box-shadow: -30px 0 60px -30px rgba(0, 0, 0, 0.9);
    transform: translateX(102%);
    transition: transform 0.42s var(--ease);
  }
  .drawer-wrap.open .drawer { transform: none; }
  .drawer header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; border-bottom: 1px solid var(--line);
  }
  .drawer header h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .drawer header .spacer { flex: 1; }
  .drawer .body { flex: 1; overflow: auto; padding: 18px 20px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stat { padding: 14px 16px; background: var(--surface); }
  .stat .k { font-size: 11px; color: var(--faint); letter-spacing: 0.05em; text-transform: uppercase; }
  .stat .v { margin-top: 4px; font-size: 13.5px; }
  pre.logs {
    margin: 0; padding: 16px; border-radius: 10px; border: 1px solid var(--line);
    background: #08090b; color: #cbd2de; font-family: "JetBrains Mono", monospace;
    font-size: 12px; line-height: 1.75; white-space: pre-wrap; word-break: break-all;
  }

  /* 记忆面板 */
  .tools { padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .tool-item { width: 100%; text-align: left; background: transparent; }
  .mem-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
  .mem-stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .mem-stat { padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.02); font-size: 12px; color: var(--muted); }
  .mem-stat b { color: var(--text); font-weight: 500; margin-left: 6px; }
  .mem-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .mem-tools input { flex: 0 1 260px; }
  .mem-list { display: grid; gap: 2px; }
  .mem-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px;
    align-items: start; padding: 11px 2px; border-top: 1px solid var(--line); }
  .mem-row .clarity { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line-strong);
    color: var(--muted); text-align: center; }
  .mem-row .clarity.vivid { color: #d6fbec; border-color: rgba(95,208,168,.45); background: rgba(95,208,168,.12); }
  .mem-row .clarity.clear { color: #bfe6d8; border-color: rgba(95,208,168,.22); }
  .mem-row .text { font-size: 13.5px; line-height: 1.5; }
  .mem-row .meta { margin-top: 3px; font-size: 11px; color: var(--faint); }
  .mem-row button { border: 0; background: transparent; color: var(--faint); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 4px 6px; border-radius: 7px; }
  .mem-row button:hover { color: var(--danger); background: rgba(226,104,111,.08); }
  .mem-progress { font-size: 12px; color: var(--warn); }

  /* 活跃度分段控件 */
  .activity { display: inline-flex; align-items: center; gap: 8px; }
  .activity .alabel { font-size: 12px; color: var(--faint); letter-spacing: 0.02em; }
  .seg {
    display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px;
    border: 1px solid var(--line-strong); background: rgba(11, 13, 16, 0.7);
  }
  .seg button {
    border: 0; background: transparent; cursor: pointer; color: var(--muted);
    font-size: 12.5px; padding: 4px 9px; border-radius: 7px;
    transition: background 0.18s var(--ease), color 0.18s var(--ease), transform 0.14s var(--ease);
  }
  .seg button:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
  .seg button:active { transform: scale(0.97); }
  .seg button.on {
    color: #d6fbec; background: rgba(95, 208, 168, 0.16);
    box-shadow: inset 0 0 0 1px rgba(95, 208, 168, 0.35);
  }

  /* Toast */
  .toasts { position: fixed; right: 22px; bottom: 82px; z-index: 50; display: grid; gap: 9px; width: min(360px, calc(100vw - 44px)); }
  .toast {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: #14171c;
    box-shadow: 0 20px 40px -24px rgba(0, 0, 0, 0.9);
    animation: toastIn 0.4s var(--ease) both;
    font-size: 13px;
  }
  .toast.leaving { animation: toastOut 0.28s var(--ease) both; }
  .toast .icon { flex: none; margin-top: 1px; }
  .toast.ok { border-color: rgba(95, 208, 168, 0.35); }
  .toast.ok .icon { color: var(--accent); }
  .toast.err { border-color: rgba(226, 104, 111, 0.4); }
  .toast.err .icon { color: var(--danger); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(6px) scale(0.98); } }

  /* 骨架 */
  .sk { border-radius: 7px; background: linear-gradient(90deg, #15181d 25%, #1c2027 37%, #15181d 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .sk-row { display: grid; gap: 8px; padding: 9px 12px; }
  .sk-line { height: 10px; }

  .empty {
    display: grid; place-items: center; gap: 12px; padding: 60px 24px;
    border: 1px dashed var(--line-strong); border-radius: 12px; color: var(--faint);
    text-align: center; font-size: 13px;
  }
  .empty svg { color: #3a414c; }

  /* 移动端：单列 */
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; overflow-x: clip; }
    .rail {
      border-right: 0; border-bottom: 1px solid var(--line);
      flex-direction: column; gap: 10px; padding: 16px 16px 12px;
      min-width: 0;
    }
    .nav { display: flex; gap: 8px; overflow-x: auto; margin: 0 -4px; padding: 4px; min-width: 0;
      mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
    .doc-head, .doc-head p { max-width: 100%; }
    .nav-group-label { display: none; }
    .nav .item { flex: none; max-width: 220px; padding: 8px 12px; }
    .item .key { display: none; }
    .rail-foot { display: none; }
    .topbar { display: none; }
    .rail-actions { display: flex; gap: 8px; padding: 2px 2px 4px; }
    .rail-actions .btn { padding: 7px 10px; }
    .rail-actions { flex-wrap: wrap; }
    .seg-mobile { width: 100%; justify-content: space-between; }
    .scroll { padding: 18px 16px 130px; }
    .fields { grid-template-columns: 1fr; column-gap: 0; }
    .actionbar { padding: 12px 16px; }
    .actionbar .btn span { display: none; }
    .toasts { right: 12px; left: 12px; width: auto; bottom: 76px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<div class="backdrop"></div>

<div class="shell" id="shell" hidden>
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="4.2"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">爱弥斯 控制台</div>
        <div class="brand-sub">AstrBot settings</div>
      </div>
    </div>

    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6" stroke-linecap="round"/>
      </svg>
      <input id="filter" type="search" placeholder="筛选插件 / 配置键" autocomplete="off" spellcheck="false">
    </label>

    <div class="rail-actions" id="railActions">
      <button class="btn ghost" data-act="status" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4 19V5M4 19h16M8 15l3-4 3 3 4-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span>状态</span>
      </button>
      <button class="btn ghost" data-act="logs" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4 7h16M4 12h10M4 17h13" stroke-linecap="round"/>
        </svg><span>日志</span>
      </button>
      <button class="btn quiet-danger" data-act="restart" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke-linecap="round"/><path d="M20 4v4h-4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span>重启</span>
      </button>
      <div class="seg seg-mobile" data-act="activity" role="group" aria-label="机器人活跃度"></div>
    </div>

    <div class="tools">
      <button class="item tool-item" id="navMemory" type="button">
        <div class="title">长期记忆</div>
        <div class="key">memory</div>
        <span class="dot"></span>
      </button>
    </div>

    <nav class="nav" id="list" aria-label="插件列表"></nav>

    <div class="rail-foot">
      <div class="status-line"><span class="pulse"></span><span id="connState">连接中…</span></div>
      <div class="status-line mono" style="color: var(--faint)">v1.0 · panel</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="crumb" id="crumb">插件 / —</span>
      <div class="spacer"></div>
      <div class="activity" title="群聊里主动插话的频率，改完立即生效">
        <span class="alabel">活跃度</span>
        <div class="seg" data-act="activity" role="group" aria-label="机器人活跃度"></div>
      </div>
      <button class="btn ghost" id="btnStatus" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4 19V5M4 19h16M8 15l3-4 3 3 4-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span>状态</span>
      </button>
      <button class="btn ghost" id="btnLogs" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4 7h16M4 12h10M4 17h13" stroke-linecap="round"/>
        </svg><span>日志</span>
      </button>
      <button class="btn quiet-danger" id="btnRestart" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke-linecap="round"/><path d="M20 4v4h-4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span>重启 AstrBot</span>
      </button>
    </div>

    <div class="scroll" id="scroll">
      <section id="content" aria-live="polite"></section>
    </div>

    <div class="actionbar" id="actionbar">
      <button class="btn primary" id="btnSave" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M5 12.5 10 17l9-10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span>保存配置</span>
      </button>
      <button class="btn" id="btnReload" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2" stroke-linecap="round"/>
          <path d="M18.5 3v4h-4M5.5 21v-4h4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg><span>重新加载</span>
      </button>
      <span class="unsaved" id="unsaved"><i></i>有未保存的修改</span>
      <div class="spacer"></div>
      <span class="count mono" id="fieldCount"></span>
    </div>
  </div>
</div>

<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="brand-mark" aria-hidden="true" style="width:36px;height:36px;border-radius:11px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="4.5" y="10" width="15" height="10.5" rx="2.5"/>
        <path d="M8 10V7.5a4 4 0 0 1 8 0V10" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>需要访问令牌</h1>
    <p>这个面板只监听服务器本机，通过 SSH 隧道访问。令牌在服务器的 <span class="mono">/opt/qqbot-dashboard/token</span>。</p>
    <label class="field" style="border:0;padding:0">
      <span class="sr-only" style="position:absolute;left:-9999px">token</span>
      <input class="input mono" id="tokenInput" type="password" placeholder="粘贴 token" autocomplete="off" spellcheck="false">
    </label>
    <div class="err" id="gateErr"></div>
    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="btn primary" type="submit" style="flex:1;justify-content:center">进入控制台</button>
    </div>
    <div class="hint">令牌只保存在浏览器 localStorage，不会上传到别处。</div>
  </form>
</div>

<div class="drawer-wrap" id="drawer" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="面板">
    <header>
      <h3 id="drawerTitle">状态</h3>
      <div class="spacer"></div>
      <button class="btn ghost" id="drawerClose" type="button">关闭</button>
    </header>
    <div class="body" id="drawerBody"></div>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<datalist id="knownGroups"></datalist>

<script>
"use strict";

const GROUP_KEYS = new Set(["watchGroups", "commentGroups", "feedGroups", "feedBlockList",
  "abstractOnlyGroups", "groups", "groupList", "whitelist"]);

const A = {
  token: localStorage.getItem("dashToken") || "",
  plugins: [],
  knownGroups: [],
  current: null,
  dirty: false,
  filter: "",
  loading: true,
};

const $ = (id) => document.getElementById(id);

/* ---------- 基础 ---------- */

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function icon(path, size) {
  const s = size || 15;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", s); svg.setAttribute("height", s);
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "1.7");
  svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
  path.forEach((d) => {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    svg.appendChild(p);
  });
  return svg;
}

function toast(message, kind) {
  const box = el("div", "toast " + (kind || ""));
  box.appendChild(icon(kind === "err" ? ["M12 8v5", "M12 16.5v.5", "M12 3.5 21 20H3z"] : ["M5 12.5 10 17l9-10"], 15));
  const body = el("div", null, message);
  box.appendChild(body);
  $("toasts").appendChild(box);
  setTimeout(() => {
    box.classList.add("leaving");
    setTimeout(() => box.remove(), 300);
  }, kind === "err" ? 5200 : 3400);
}

function setDirty(on) {
  A.dirty = on;
  $("unsaved").classList.toggle("show", on);
}

/* ---------- 接口 ---------- */

function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (A.token) headers["X-Token"] = A.token;
  return fetch(path, Object.assign({}, opts, { headers })).then(async (res) => {
    if (res.status === 401) {
      showGate();
      throw new Error("unauthorized");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  });
}

/* ---------- 登录门 ---------- */

function showGate() {
  $("gate").hidden = false;
  $("shell").hidden = true;
  setTimeout(() => { const i = $("tokenInput"); if (i) i.focus(); }, 60);
}

$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const value = $("tokenInput").value.trim();
  const err = $("gateErr");
  err.classList.remove("show");
  if (!value) {
    err.textContent = "请输入令牌";
    err.classList.add("show");
    return;
  }
  A.token = value;
  try {
    await api("/api/plugins");
    localStorage.setItem("dashToken", value);
    $("gate").hidden = true;
    $("shell").hidden = false;
    await load();
  } catch (ex) {
    A.token = "";
    err.textContent = ex.message === "unauthorized" ? "令牌不正确" : ("连接失败：" + ex.message);
    err.classList.add("show");
  }
});

/* ---------- 列表 ---------- */

function pluginLabel(p) {
  return p.display_name || p.name;
}

function filtered() {
  const q = A.filter.trim().toLowerCase();
  if (!q) return A.plugins;
  return A.plugins.filter((p) => {
    const hay = [pluginLabel(p), p.name, p.desc || ""].join(" ").toLowerCase();
    return hay.includes(q);
  });
}

function renderList() {
  const nav = $("list");
  nav.innerHTML = "";
  const list = filtered();
  if (!list.length) {
    nav.appendChild(el("div", "empty", "没有匹配的插件"));
    return;
  }
  list.forEach((p, i) => {
    const item = el("div", "item" + (A.current && A.current.name === p.name ? " active" : ""));
    item.style.setProperty("--i", i);
    item.tabIndex = 0;
    item.setAttribute("role", "button");
    item.appendChild(el("div", "title", pluginLabel(p)));
    item.appendChild(el("div", "key mono", p.name.replace("astrbot_plugin_", "")));
    item.appendChild(el("span", "dot"));
    const activate = () => selectPlugin(p.name);
    item.addEventListener("click", activate);
    item.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
    });
    nav.appendChild(item);
  });
}

/* ---------- 表单 ---------- */

function isGroupList(key) {
  return GROUP_KEYS.has(key) || /groups$/i.test(key) || /(blocklist|whitelist)$/i.test(key);
}

function splitIds(v) {
  return String(v || "").split(/[,，\s]+/).map((s) => s.trim()).filter(Boolean);
}

function fieldShell(key, spec, wide) {
  const field = el("div", "field" + (wide ? " wide" : ""));
  const label = el("label", null);
  label.appendChild(el("span", null, key));
  const typ = spec && spec.type ? spec.type : "string";
  label.appendChild(el("span", "k mono", typ));
  field.appendChild(label);
  if (spec && spec.description) {
    field.appendChild(el("p", "hint", spec.description));
  }
  return field;
}

function markDirty() {
  setDirty(true);
  const el2 = $("content");
  el2.dataset.dirty = "1";
}

function buildInput(spec, value, key) {
  const typ = (spec && spec.type) || "string";
  if (typ === "bool") {
    const wrap = el("label", "switch");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.dataset.key = key;
    input.dataset.type = "bool";
    input.checked = value === true || value === "true";
    const track = el("span", "track");
    const state = el("span", "state", input.checked ? "开" : "关");
    input.addEventListener("change", () => {
      state.textContent = input.checked ? "开" : "关";
      markDirty();
    });
    wrap.appendChild(input);
    wrap.appendChild(track);
    wrap.appendChild(state);
    return wrap;
  }
  if (typ === "int" || typ === "float") {
    const input = document.createElement("input");
    input.className = "input mono";
    input.type = "number";
    input.dataset.key = key;
    input.dataset.type = typ;
    if (typ === "float") input.step = "any";
    input.value = value === undefined || value === null ? "" : value;
    input.addEventListener("input", markDirty);
    return input;
  }
  if (typ === "text") {
    const input = document.createElement("textarea");
    input.className = "input";
    input.dataset.key = key;
    input.dataset.type = "text";
    input.spellcheck = false;
    input.value = value === undefined || value === null ? "" : value;
    input.addEventListener("input", markDirty);
    return input;
  }
  const input = document.createElement("input");
  input.className = "input";
  input.type = "text";
  input.dataset.key = key;
  input.dataset.type = typ;
  input.spellcheck = false;
  if (typeof value === "object" && value !== null) {
    input.value = JSON.stringify(value);
    input.dataset.json = "1";
  } else {
    input.value = value === undefined || value === null ? "" : value;
  }
  input.addEventListener("input", markDirty);
  return input;
}

function groupField(spec, value, key) {
  const field = fieldShell(key, spec, true);
  const box = el("div", "chipbox");
  box.dataset.key = key;
  box.dataset.type = "string";
  box.dataset.value = splitIds(value).join(",");
  const chips = el("div", "chips");
  box.appendChild(chips);

  const row = el("div", "chip-row");
  const input = document.createElement("input");
  input.className = "input mono";
  input.type = "text";
  input.placeholder = "输入群号后回车";
  input.setAttribute("list", "knownGroups");
  input.inputMode = "numeric";
  row.appendChild(input);

  const add = el("button", "btn", "添加");
  add.type = "button";
  row.appendChild(add);

  const count = el("span", "count mono");
  row.appendChild(count);
  box.appendChild(row);

  const render = () => {
    const ids = splitIds(box.dataset.value);
    chips.innerHTML = "";
    if (!ids.length) chips.appendChild(el("span", "count", "尚未添加任何群号"));
    ids.forEach((id) => {
      const chip = el("span", "chip");
      chip.appendChild(el("span", "mono", id));
      const x = el("button", null, "×");
      x.type = "button";
      x.setAttribute("aria-label", "移除 " + id);
      x.addEventListener("click", () => {
        box.dataset.value = splitIds(box.dataset.value).filter((v) => v !== id).join(",");
        render();
        markDirty();
      });
      chip.appendChild(x);
      chips.appendChild(chip);
    });
    count.textContent = ids.length ? ids.length + " 个" : "";
  };

  const addOne = () => {
    const id = input.value.trim();
    if (!/^\d{5,12}$/.test(id)) {
      input.classList.add("invalid");
      toast("群号应为 5 到 12 位数字", "err");
      setTimeout(() => input.classList.remove("invalid"), 1200);
      return;
    }
    const ids = splitIds(box.dataset.value);
    if (!ids.includes(id)) ids.push(id);
    box.dataset.value = ids.join(",");
    input.value = "";
    render();
    markDirty();
  };
  add.addEventListener("click", addOne);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); addOne(); }
  });
  render();
  field.appendChild(box);
  return field;
}

function renderForm() {
  const box = $("content");
  box.innerHTML = "";
  const p = A.current;
  $("crumb").textContent = "插件 / " + (p ? pluginLabel(p) : "—");
  if (!p) {
    box.appendChild(el("div", "empty", "左侧选择一个插件"));
    $("fieldCount").textContent = "";
    return;
  }
  const head = el("div", "doc-head");
  head.appendChild(el("h2", null, pluginLabel(p)));
  head.appendChild(el("p", null, p.desc || "这个插件没有填写说明。"));
  const meta = el("div", "meta-row");
  meta.appendChild(el("span", "tag mono", p.name));
  const keys = Object.keys(p.schema || {});
  meta.appendChild(el("span", p.has_config ? "tag accent" : "tag",
    p.has_config ? "已保存配置" : "默认配置"));
  head.appendChild(meta);
  box.appendChild(head);

  if (!keys.length) {
    const empty = el("div", "empty");
    empty.appendChild(icon(["M4 7h16", "M4 12h10"], 20));
    empty.appendChild(el("div", null, "这个插件没有可配置项"));
    box.appendChild(empty);
    $("fieldCount").textContent = "";
    return;
  }

  const grid = el("div", "fields");
  keys.forEach((key) => {
    const spec = p.schema[key] || {};
    const typ = spec.type || "string";
    const wide = typ === "text" || isGroupList(key);
    grid.appendChild(isGroupList(key) && typ === "string"
      ? groupField(spec, p.config[key], key)
      : (() => {
          const field = fieldShell(key, spec, wide);
          if (typ === "bool") field.classList.add("bool");
          field.appendChild(buildInput(spec, p.config[key], key));
          return field;
        })());
  });
  Object.keys(p.config).filter((k) => !(k in p.schema)).forEach((key) => {
    const value = p.config[key];
    const spec = { type: typeof value === "object" ? "text" : "string",
      description: "不在 schema 里的额外配置，改动需谨慎" };
    const field = fieldShell(key, spec, true);
    field.appendChild(buildInput(spec, value, key));
    grid.appendChild(field);
  });
  box.appendChild(grid);
  $("fieldCount").textContent = keys.length + " 项";
  setDirty(false);
}

function selectPlugin(name) {
  A.view = "plugin";
  $("actionbar").style.display = "";
  if (A.dirty && !window.confirm("当前修改还没保存，切换会丢失，继续？")) return;
  A.current = A.plugins.find((p) => p.name === name) || null;
  setDirty(false);
  renderList();
  renderForm();
  $("scroll").scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- 数据 ---------- */

async function load() {
  A.loading = true;
  renderSkeleton();
  try {
    const data = await api("/api/plugins");
    A.plugins = data.plugins || [];
    const prefer = A.plugins.find((p) => p.name === "astrbot_plugin_aemeath_chishi");
    if (!A.current || !A.plugins.some((p) => p.name === A.current.name)) {
      A.current = prefer || A.plugins[0] || null;
    } else {
      A.current = A.plugins.find((p) => p.name === A.current.name);
    }
    try {
      const g = await api("/api/groups");
      fillKnownGroups(g.groups || []);
    } catch (e) { /* 群号提示失败不影响主流程 */ }
    try {
      A.activity = await api("/api/activity");
      renderActivity();
    } catch (e) { /* 活跃度不可用时不影响主流程 */ }
    $("connState").textContent = A.plugins.length + " 个插件已加载";
    renderList();
    renderForm();
  } catch (e) {
    $("connState").textContent = "连接失败";
    if (e.message !== "unauthorized") toast("加载失败：" + e.message, "err");
    renderError(e.message);
  } finally {
    A.loading = false;
  }
}

function fillKnownGroups(ids) {
  A.knownGroups = ids;
  const dl = $("knownGroups");
  dl.innerHTML = "";
  ids.forEach((id) => {
    const opt = document.createElement("option");
    opt.value = id;
    dl.appendChild(opt);
  });
}


/* ---------- 长期记忆 ---------- */

const MEM_LABEL = { vivid: "清晰", clear: "清楚", fuzzy: "模糊", trace: "只剩印象", forgotten: "遗忘" };

function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return (d.getMonth() + 1) + "/" + d.getDate();
}

async function openMemory() {
  A.view = "memory";
  A.memoryQuery = A.memoryQuery || "";
  document.querySelectorAll(".item").forEach((n) => n.classList.remove("active"));
  $("navMemory").classList.add("active");
  $("crumb").textContent = "工具 / 长期记忆";
  $("actionbar").style.display = "none";
  renderMemorySkeleton();
  await loadMemory();
}

async function loadMemory() {
  try {
    const state = await api("/api/memory?q=" + encodeURIComponent(A.memoryQuery || ""));
    A.memory = state;
    renderMemory();
  } catch (e) {
    if (e.message !== "unauthorized") toast("读取记忆失败：" + e.message, "err");
  }
}

function renderMemorySkeleton() {
  const box = $("content");
  box.innerHTML = "";
  const head = el("div", "doc-head");
  const h = el("div", "sk sk-line");
  h.style.width = "30%"; h.style.height = "26px";
  head.appendChild(h);
  box.appendChild(head);
  for (let i = 0; i < 5; i++) {
    const row = el("div", "sk");
    row.style.height = "38px"; row.style.marginBottom = "8px";
    box.appendChild(row);
  }
}

function renderMemory() {
  const box = $("content");
  const st = A.memory || { total: 0, records: [], by_clarity: {}, by_scope: {} };
  box.innerHTML = "";

  const head = el("div", "doc-head");
  head.appendChild(el("h2", null, "长期记忆"));
  head.appendChild(el("p", null, "爱弥斯自己记住的事：越靠前越清楚，模糊的是快忘了。删掉就真的忘了。"));
  box.appendChild(head);

  const stats = el("div", "mem-stats");
  const add = (label, value) => {
    const cell = el("div", "mem-stat", label);
    cell.appendChild(el("b", "mono", String(value)));
    stats.appendChild(cell);
  };
  add("共", st.total);
  add("清晰", (st.by_clarity.vivid || 0) + (st.by_clarity.clear || 0));
  add("模糊", (st.by_clarity.fuzzy || 0) + (st.by_clarity.trace || 0));
  add("已遗忘", st.by_clarity.forgotten || 0);
  add("全局", st.by_scope["全局"] || 0);
  const bar = el("div", "mem-head");
  bar.appendChild(stats);
  box.appendChild(bar);

  const tools = el("div", "mem-tools");
  const search = document.createElement("input");
  search.className = "input";
  search.placeholder = "搜索记忆内容";
  search.value = A.memoryQuery || "";
  search.addEventListener("input", () => {
    A.memoryQuery = search.value;
    clearTimeout(A.memTimer);
    A.memTimer = setTimeout(loadMemory, 300);
  });
  tools.appendChild(search);

  const refresh = el("button", "btn", "刷新");
  refresh.type = "button";
  refresh.addEventListener("click", loadMemory);
  tools.appendChild(refresh);

  const backfill = el("button", "btn primary", "回填历史");
  backfill.type = "button";
  backfill.addEventListener("click", () => backfillMemory(7));
  tools.appendChild(backfill);

  const clear = el("button", "btn quiet-danger", "清空全部");
  clear.type = "button";
  clear.addEventListener("click", async () => {
    if (!window.confirm("清空全部记忆？这个操作不可撤销（会留 .bak 备份）")) return;
    try {
      await api("/api/memory", { method: "POST", body: JSON.stringify({ action: "clear" }) });
      toast("已清空记忆", "ok");
      loadMemory();
    } catch (e) {
      if (e.message !== "unauthorized") toast("清空失败：" + e.message, "err");
    }
  });
  tools.appendChild(clear);

  const bf = st.backfill || {};
  if (bf.state === "running" || bf.state === "requested") {
    const p = el("span", "mem-progress",
      (bf.state === "requested" ? "等待插件接单" : "回填中") + "　" + (bf.done || 0) + "/" + (bf.total || 0) + "，新增 " + (bf.added || 0));
    tools.appendChild(p);
    clearTimeout(A.memPoll);
    A.memPoll = setTimeout(() => { if (A.view === "memory") loadMemory(); }, 3000);
  } else if (bf.state === "done") {
    tools.appendChild(el("span", "count", "上次回填新增 " + (bf.added || 0) + " 条"));
  } else if (bf.state === "error") {
    tools.appendChild(el("span", "mem-progress", "回填失败：" + (bf.error || "")));
  }
  box.appendChild(tools);

  if (!st.records.length) {
    const empty = el("div", "empty");
    empty.appendChild(el("div", null, A.memoryQuery ? "没有匹配的记忆" : "还没有记忆，聊满 20 条后会自动开始记"));
    box.appendChild(empty);
    return;
  }

  const list = el("div", "mem-list");
  st.records.forEach((rec) => {
    const row = el("div", "mem-row");
    const tag = el("span", "clarity " + (rec.clarity || "clear"), MEM_LABEL[rec.clarity] || "清楚");
    row.appendChild(tag);
    const body = el("div");
    body.appendChild(el("div", "text", rec.text));
    const scope = rec.scope === "global" ? "全局" : String(rec.scope || "").replace("group:", "群 ");
    const meta = el("div", "meta mono",
      scope + "｜重要度 " + (rec.importance || 50) + "｜" + fmtDate(rec.last_seen || rec.created)
      + (rec.pinned ? "｜永久" : ""));
    body.appendChild(meta);
    row.appendChild(body);
    const del = el("button", null, "×");
    del.type = "button";
    del.title = "忘掉这条";
    del.addEventListener("click", () => deleteMemory(rec.id));
    row.appendChild(del);
    list.appendChild(row);
  });
  box.appendChild(list);
}

async function deleteMemory(id) {
  try {
    await api("/api/memory", { method: "POST", body: JSON.stringify({ action: "delete", id }) });
    toast("忘掉了", "ok");
    loadMemory();
  } catch (e) {
    if (e.message !== "unauthorized") toast("删除失败：" + e.message, "err");
  }
}

async function backfillMemory(days) {
  try {
    await api("/api/memory", { method: "POST", body: JSON.stringify({ action: "backfill", days }) });
    toast("已请求回填最近 " + days + " 天，插件接单后开始跑", "ok");
    loadMemory();
  } catch (e) {
    if (e.message !== "unauthorized") toast("请求失败：" + e.message, "err");
  }
}

/* ---------- 活跃度 ---------- */

function renderActivity() {
  const segs = document.querySelectorAll('[data-act="activity"]');
  const levels = (A.activity && A.activity.levels) || [];
  segs.forEach((seg) => {
    seg.innerHTML = "";
    if (!levels.length) {
      seg.appendChild(el("span", "count", "不可用"));
      return;
    }
    levels.forEach((lvl) => {
      const btn = el("button", lvl.key === A.activity.level ? "on" : null, lvl.label);
      btn.type = "button";
      btn.setAttribute("aria-pressed", String(lvl.key === A.activity.level));
      btn.title = "概率 " + lvl.values.probability + "｜冷却 " + lvl.values.cooldown + " 秒｜最短 " + lvl.values.min_len + " 字";
      btn.addEventListener("click", () => setActivity(lvl.key, lvl.label));
      seg.appendChild(btn);
    });
  });
}

async function setActivity(level, label) {
  try {
    const state = await api("/api/activity", {
      method: "POST",
      body: JSON.stringify({ level }),
    });
    A.activity = state;
    renderActivity();
    toast("活跃度已设为「" + (label || level) + "」，立即生效", "ok");
  } catch (e) {
    if (e.message !== "unauthorized") toast("设置活跃度失败：" + e.message, "err");
  }
}

function renderSkeleton() {
  const box = $("content");
  box.innerHTML = "";
  const head = el("div", "doc-head");
  const h = el("div", "sk sk-line");
  h.style.width = "38%"; h.style.height = "26px"; h.style.marginBottom = "12px";
  const p = el("div", "sk sk-line");
  p.style.width = "62%";
  head.appendChild(h); head.appendChild(p);
  box.appendChild(head);
  const grid = el("div", "fields");
  for (let i = 0; i < 6; i++) {
    const field = el("div", "field" + (i % 3 === 0 ? " wide" : ""));
    const a = el("div", "sk sk-line"); a.style.width = "30%"; a.style.marginBottom = "10px";
    const b = el("div", "sk"); b.style.height = "36px";
    field.appendChild(a); field.appendChild(b);
    grid.appendChild(field);
  }
  box.appendChild(grid);
}

function renderError(message) {
  const box = $("content");
  box.innerHTML = "";
  const wrap = el("div", "empty");
  wrap.appendChild(icon(["M12 8v5", "M12 16.5v.5", "M12 3.5 21 20H3z"], 22));
  wrap.appendChild(el("div", null, message === "unauthorized"
    ? "令牌无效，请重新输入"
    : ("加载失败：" + message)));
  const btn = el("button", "btn", "重试");
  btn.type = "button";
  btn.addEventListener("click", load);
  wrap.appendChild(btn);
  box.appendChild(wrap);
}

/* ---------- 保存 ---------- */

function collect() {
  const payload = {};
  $("content").querySelectorAll("[data-key]").forEach((node) => {
    const key = node.dataset.key;
    if (node.classList.contains("chipbox")) {
      payload[key] = node.dataset.value || "";
      return;
    }
    if (node.tagName === "INPUT" && node.type === "checkbox") {
      payload[key] = node.checked;
      return;
    }
    if (node.dataset.json) {
      try { payload[key] = JSON.parse(node.value); } catch (e) { payload[key] = node.value; }
      return;
    }
    payload[key] = node.value;
  });
  return payload;
}

async function save() {
  if (!A.current) return;
  const p = A.current;
  const btn = $("btnSave");
  btn.disabled = true;
  try {
    const res = await api("/api/save", {
      method: "POST",
      body: JSON.stringify({ plugin: p.name, config: collect() }),
    });
    p.config = res.config;
    p.has_config = true;
    setDirty(false);
    toast("已保存 " + pluginLabel(p) + "，重启 AstrBot 后生效", "ok");
  } catch (e) {
    if (e.message !== "unauthorized") toast("保存失败：" + e.message, "err");
  } finally {
    btn.disabled = false;
  }
}

/* ---------- 抽屉 ---------- */

function openDrawer(title, build) {
  $("drawerTitle").textContent = title;
  const body = $("drawerBody");
  body.innerHTML = "";
  $("drawer").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  build(body);
}

function closeDrawer() {
  $("drawer").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
}

$("drawerClose").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
});

/* ---------- 顶栏动作 ---------- */

async function openStatusPanel() {
  openDrawer("运行状态", (body) => {
    const sk = el("div", "sk"); sk.style.height = "90px";
    body.appendChild(sk);
  });
  try {
    const s = await api("/api/status");
    const body = $("drawerBody");
    body.innerHTML = "";
    const grid = el("div", "stat-grid");
    (s.containers || []).forEach((c) => {
      const cell = el("div", "stat");
      cell.appendChild(el("div", "k", c.name));
      cell.appendChild(el("div", "v mono", c.status));
      grid.appendChild(cell);
    });
    const mem = el("div", "stat");
    mem.appendChild(el("div", "k", "memory"));
    mem.appendChild(el("div", "v mono", s.memory || "—"));
    grid.appendChild(mem);
    body.appendChild(grid);
  } catch (e) {
    if (e.message !== "unauthorized") toast("状态获取失败：" + e.message, "err");
  }
}

async function openLogsPanel() {
  openDrawer("AstrBot 日志", (body) => {
    const sk = el("div", "sk"); sk.style.height = "160px";
    body.appendChild(sk);
  });
  try {
    const res = await api("/api/logs?lines=200");
    const body = $("drawerBody");
    body.innerHTML = "";
    body.appendChild(el("pre", "logs", res.logs || "(空)"));
  } catch (e) {
    if (e.message !== "unauthorized") toast("日志获取失败：" + e.message, "err");
  }
}

function openRestartPanel() {
  openDrawer("确认重启", (body) => {
    body.appendChild(el("p", null, "重启 AstrBot 会让机器人离线约 20 秒，正在处理的消息会中断。"));
    const row = el("div", "chip-row");
    const go = el("button", "btn danger", "确认重启");
    go.type = "button";
    const cancel = el("button", "btn", "取消");
    cancel.type = "button";
    cancel.addEventListener("click", closeDrawer);
    go.addEventListener("click", async () => {
      go.disabled = true;
      try {
        const res = await api("/api/restart", { method: "POST", body: "{}" });
        toast(res.ok ? "已重启 AstrBot" : "重启失败：" + res.output, res.ok ? "ok" : "err");
        closeDrawer();
      } catch (e) {
        if (e.message !== "unauthorized") toast("重启失败：" + e.message, "err");
        go.disabled = false;
      }
    });
    row.appendChild(go); row.appendChild(cancel);
    body.appendChild(row);
  });
}

document.querySelectorAll('[data-act="status"], #btnStatus').forEach((b) =>
  b.addEventListener("click", openStatusPanel));
document.querySelectorAll('[data-act="logs"], #btnLogs').forEach((b) =>
  b.addEventListener("click", openLogsPanel));
document.querySelectorAll('[data-act="restart"], #btnRestart').forEach((b) =>
  b.addEventListener("click", openRestartPanel));

$("navMemory").addEventListener("click", openMemory);

$("btnSave").addEventListener("click", save);
$("btnReload").addEventListener("click", () => {
  if (A.dirty && !window.confirm("重新加载会丢弃未保存的修改，继续？")) return;
  load();
});

$("filter").addEventListener("input", (e) => {
  A.filter = e.target.value;
  renderList();
});

window.addEventListener("beforeunload", (e) => {
  if (A.dirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});

/* ---------- 启动 ---------- */

// 支持 ?token= 深链（方便书签/截图），读入后写进 localStorage
(function adoptQueryToken() {
  const params = new URLSearchParams(location.search);
  const t = (params.get("token") || "").trim();
  if (t) {
    A.token = t;
    localStorage.setItem("dashToken", t);
    history.replaceState(null, "", location.pathname);
  }
})();

if (A.token) {
  $("shell").hidden = false;
  load().catch(() => {});
} else {
  showGate();
}
</script>
