# AstrBot + NapCat 编排（爱弥斯插件框架）
#
# 启动：docker compose up -d
# WebUI：http://127.0.0.1:6185（仅回环，远程请用 SSH 隧道）
#
# 说明：
# - 插件目录 ./plugins 直接挂载到容器，改代码后重启 AstrBot 即生效
# - AstrBot 数据在 ./data（首次启动自动生成，不入库）
# - NapCat 首次需扫码登录：WebUI http://127.0.0.1:6099/webui

services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:6185:6185"
    volumes:
      - ./data:/AstrBot/data
      - ./plugins:/AstrBot/data/plugins
    depends_on:
      - napcat

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"   # 正向 WebSocket（AstrBot 的 aiocqhttp 连这里）
      - "127.0.0.1:6099:6099"   # WebUI / 扫码登录
    volumes:
      - ./napcat-data/config:/app/napcat/config
      - ./napcat-data/qq:/app/.config/QQ
