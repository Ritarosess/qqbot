# NapCat QQ 协议端（OneBot v11）
# 只监听 127.0.0.1：外部无法直连，必须通过 SSH 隧道访问 WebUI
# WebUI Token 从同目录 .env 读取（install.sh 会自动生成）
version: "3.8"

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      MODE: ws
      WEBUI_TOKEN: ${WEBUI_TOKEN}
    ports:
      - "127.0.0.1:6099:6099"   # WebUI（扫码登录用）
      - "127.0.0.1:3001:3001"   # 正向 WebSocket（bot.py 连接）
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins
